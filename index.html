<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .gradient-text {
            background: linear-gradient(90deg, #48bb78, #4299e1);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero-description {
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .card {
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card-content {
            position: relative;
        }

        .image-container {
            position: relative;
            height: 400px;
        }

        .image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.6);
        }

        .text-overlay {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
        }

        .card-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card-description {
            color: #555;
        }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .approach {
            padding: 1.5rem;
            border-radius: 0.5rem;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .approach-title {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }

        .approach-description {
            color: #555;
        }

        .button-group {
            display: flex;
            gap: 1rem;
        }

        .book-session-btn,
        .consultation-btn {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
        }

        .book-session-btn {
            background-color: #38a169; /* Green */
            color: white;
        }

        .book-session-btn:hover {
            background-color: #2f855a; /* Darker green */
        }

        .consultation-btn {
            background-color: transparent;
            color: #333;
            border: 2px solid #333;
        }

        .consultation-btn:hover {
            background-color: #333;
            color: white;
        }








</style>

<div class="main-container">
    <section class="hero-section">
        <h1 class="hero-title">
            <span class="gradient-text">Klinik Psikolog Büşra Günaydın</span>
        </h1>
        <a class="hero-description">
            Online ve Yüz Yüze Danışmanlık
        </a>
    </section>

    <div class="card">
        <div class="card-content">
            <div class="image-container">
                <img src="/assets/img/bg.jpg" class="image"/>
                <div class="overlay"></div>
                <div class="text-overlay">
                    <ul style="list-style: none; padding: 0; text-align: center; margin-bottom: 100px;">
                        <li class="card-title" style="font-size: 28px; font-weight: normal;">Çocuk Psikolojisi</li>
                        <li class="card-title" style="font-size: 28px; font-weight: normal;">Ergen Psikolojisi</li>
                        <li class="card-title" style="font-size: 28px; font-weight: normal;">Yetişkin Psikolojisi</li>
                    </ul>

                </div>
            </div>
        </div>

    </div>
</div>
